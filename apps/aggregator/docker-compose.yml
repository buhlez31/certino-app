version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: treetino-postgres
    environment:
      POSTGRES_USER: treetino
      POSTGRES_PASSWORD: password
      POSTGRES_DB: treetino_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
